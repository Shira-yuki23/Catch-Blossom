<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer ></script>
        <title>
            Catch Blossom
        </title>
    </head>
    <body>
        <section class="score-board">
        <div id="score">Game Score: <span id="score-val">0</span></div>
        <div id="high-score">Highest Score: <span id="high-score-val">0</span></div>
        <div id="live">Remaining 🌸: <span id="live-remain">5</span></div>
        </section>
        <div class="game-area">
            <img class="bg-img" src="assets/background.png" alt="BG">
        <div class="basket">
            <img class="basket-img" src="assets/basket0.png" alt="Basket">
        </div>
        <div class="flower">
            <img class="flower-img" src="assets/petal.png" alt="Falling sakura blossom">
        </div>
        </div>
        <footer> Hard coded by Shira-yuki23 </footer>
    </body>
    
</html>
