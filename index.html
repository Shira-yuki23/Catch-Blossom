<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer ></script>
        <title>
            Catch Blossom
        </title>
        <link rel="icon" type="image/png" href="assets/favcon.png">
    </head>
    <body>
        <div class="gamearea">
            <img class="bg-img" src="assets/background.png">
            <section class="score-board">
                <div id="score">Game Score: <span id="score-val">0</span></div>
                <div id="high-score">Highest Score: <span id="high-score-val">0</span></div>
                <div id="live">Remaining : <span id="live-remain">🌸🌸🌸🌸🌸 </span></div>
            </section>        
            <div class="flower">
                <img class="flower-img" src="assets/petal.png" alt="Falling sakura blossom">
            </div>
            <div class="basket">
            <img class="basket-img" src="assets/basket0.png" alt="Basket">
            </div>
            <section id="start-screen">
                <div class="end-card">
                    <h1>Catch Blossom 🌸</h1>
                    <p>Catch the blossoms before they fall!</p>
                    <p>Move with your mouse, ← → keys, or touch and drag.</p>
                    <button id="start-btn" type="button">Start Game</button>
                </div>
            </section>
            <section id="end-screen" hidden>
                <div class="end-card">
                    <h1>Game Over 🌸</h1>

                    <p>Your score: <span id="final-score">0</span></p>
                    <p>Highest score: <span id="final-high-score">0</span></p>

                    <button id="restart-btn" type="button">Play Again</button>
                </div>
            </section>
        
            <footer> Hard coded by Shira-yuki23 </footer>
        </div>
        
    </body>
    
</html>
